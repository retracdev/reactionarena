<!doctype html>
<html lang="en" class="is-splashing">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Set from version.yml by `npm run set-version` and the "Sync version" workflow. Don't edit by hand. -->
  <meta name="reactionarena-version" content="1.0.0">
  <script src="js/live-update.js" data-live-update></script>
  <title>Reaction Arena — test your reflexes &amp; memory</title>
  <meta name="description" content="Ten quick browser challenges for reaction time, aim, typing, memory, precision and more. Part of the retrac.space collection.">
  <meta name="theme-color" content="#0a0b09">
  <!-- social:start (generated by `npm run build:social`) -->
  <link rel="canonical" href="https://reaction.retrac.space/">
  <meta property="og:site_name" content="Reaction Arena">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Reaction Arena">
  <meta property="og:description" content="Ten quick browser challenges for reflexes, memory, focus and precision. Part of the retrac.space collection.">
  <meta property="og:url" content="https://reaction.retrac.space/">
  <meta property="og:image" content="https://reaction.retrac.space/assets/social/home.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Reaction Arena: how quick is your mind, really?">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Reaction Arena">
  <meta name="twitter:description" content="Ten quick browser challenges for reflexes, memory, focus and precision. Part of the retrac.space collection.">
  <meta name="twitter:image" content="https://reaction.retrac.space/assets/social/home.jpg">
  <meta name="twitter:image:alt" content="Reaction Arena: how quick is your mind, really?">
  <!-- social:end -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/accounts.css">
  <link rel="stylesheet" href="css/updates.css">
  <script type="module" src="js/main.js"></script>
  <noscript><style>.splash { display: none; } html.is-splashing { overflow: auto; }</style></noscript>
</head>
<body>
  <!-- The loading screen. js/splash.js fills the bar and takes it away. Live updates show it again (data-update-splash). -->
  <div class="splash" id="splash" data-update-splash role="progressbar" aria-label="Loading Reaction Arena" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <img class="splash__icon" src="assets/logo-mark.svg" alt="" width="112" height="112">
    <div class="splash__track"><div class="splash__fill"></div></div>
  </div>

  <div class="bg" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/" aria-label="Reaction Arena home">
        <img src="assets/logo-mark.svg" alt="" width="34" height="34">
        <span class="wordmark">reaction<span>arena</span></span>
      </a>
      <nav class="header-nav" aria-label="Main">
        <a class="collection" href="https://retrac.space" rel="noopener">
          <span class="collection-label">part of</span>
          <b>retrac<span>.space</span></b>
        </a>
        <a class="nav-link" href="#/leaderboards" data-nav="leaderboards">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
          <span>Leaderboards</span>
        </a>
        <a class="account-button" id="accountButton" href="https://accounts.retrac.space" target="_blank" rel="noopener">
          <img src="assets/retrac-space-icon.png" alt="" aria-hidden="true">
          <span id="accountLabel">Sign in</span>
        </a>
      </nav>
    </div>
  </header>

  <main id="app" class="container">
    <noscript><p class="noscript">Reaction Arena needs JavaScript to run its tests.</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="brand brand-sm" href="#/">
        <img src="assets/logo-mark.svg" alt="" width="24" height="24">
        <span class="wordmark">reaction<span>arena</span></span>
      </a>
      <p class="footer-note">Sign in with retrac.space to put your best scores on the leaderboards.</p>
      <div class="footer-end">
        <button class="btn btn-ghost footer__update" id="checkUpdates" type="button" hidden>
          <svg class="footer__update-spinner" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
          <span id="checkUpdatesLabel">Check for Updates</span>
        </button>
        <a class="footer-collection" href="https://retrac.space" rel="noopener">
          A <b>retrac<span>.space</span></b> project
        </a>
      </div>
    </div>
  </footer>

  <script src="js/splash.js"></script>
  <script src="js/toasts.js"></script>
  <script src="js/updates.js"></script>
</body>
</html>
